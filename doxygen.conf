# Doxygen configuration for BETTA HA Panel.
# Run from the repository root with: doxygen doxygen.conf

PROJECT_NAME           = "BETTA HA Panel"
PROJECT_BRIEF          = "ESP-IDF firmware and supporting tools for Home Assistant touch panels"
PROJECT_NUMBER         = "0.9.0"
OUTPUT_DIRECTORY       = build/doxygen

OUTPUT_LANGUAGE        = English
CREATE_SUBDIRS         = YES
FULL_PATH_NAMES        = YES
STRIP_FROM_PATH        = .
TAB_SIZE               = 4
AUTOLINK_SUPPORT       = YES
BUILTIN_STL_SUPPORT    = YES
SORT_MEMBER_DOCS       = YES
SORT_BRIEF_DOCS        = YES

# Keep the public documentation useful while still exposing static firmware
# helpers and source locations for maintainers.
EXTRACT_ALL             = NO
EXTRACT_STATIC          = YES
HIDE_UNDOC_MEMBERS      = NO
HIDE_UNDOC_CLASSES      = NO
WARN_IF_UNDOCUMENTED    = YES
WARN_IF_UNDOC_ENUM_VAL  = YES
WARN_NO_PARAMDOC        = NO
WARN_AS_ERROR           = NO

INPUT                  = README.md docs main components tests
RECURSIVE              = YES
FILE_PATTERNS          = *.c *.h *.cc *.cpp *.cxx *.hh *.hpp *.hxx *.md
EXTENSION_MAPPING      = inc=C

# These paths are generated, fetched, binary, or browser-only artifacts and
# should not affect the firmware API documentation.
EXCLUDE_PATTERNS       = */build/* */site/* */managed_components/* */third_party/* */.git/* */.venv/* */__pycache__/* components/webui/www/* main/ui/fonts/* main/ui/weather_icons/* tests/fixtures/*

GENERATE_HTML           = YES
HTML_OUTPUT             = html
HTML_TIMESTAMP          = NO
HTML_DYNAMIC_MENUS      = YES
GENERATE_TREEVIEW       = YES
DISABLE_INDEX           = NO
SEARCHENGINE            = YES
SERVER_BASED_SEARCH     = NO

GENERATE_XML            = YES
XML_OUTPUT              = xml
XML_PROGRAMLISTING      = YES

GENERATE_LATEX          = NO
GENERATE_MAN             = NO
GENERATE_RTF             = NO
GENERATE_DOCBOOK         = NO
GENERATE_AUTOGEN_DEF     = NO

SOURCE_BROWSER           = YES
INLINE_SOURCES           = NO
REFERENCED_BY_RELATION   = YES
REFERENCES_RELATION      = YES
CALL_GRAPH               = NO
CALLER_GRAPH             = NO

HAVE_DOT                = NO
CLASS_DIAGRAMS          = NO
UML_LOOK                = NO

QUIET                   = NO
WARNINGS                = YES
WARN_FORMAT             = "$file:$line: $text"
WARN_LOGFILE            = build/doxygen/warnings.log

GENERATE_TAGFILE        = build/doxygen/betta-ha-panel.tag
DISABLE_PREPROCESSING   = NO
MACRO_EXPANSION         = NO
EXPAND_ONLY_PREDEF      = NO
PREDEFINED              = ESP_PLATFORM CONFIG_IDF_TARGET_ESP32P4 CONFIG_IDF_TARGET_ESP32S3

LAYOUT_FILE             =
HTML_EXTRA_STYLESHEET   =
HTML_EXTRA_FILES        =
